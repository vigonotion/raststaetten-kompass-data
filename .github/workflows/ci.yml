# Tests, lints and contract checks for every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Validate the example dataset
        run: cargo run --release -- validate --dataset ../docs/example-dataset.json --brands ../data/brands.json

      - name: Check shell scripts
        working-directory: .
        run: |
          bash -n scripts/download-extract.sh
          bash -n scripts/release-dataset.sh
